name: Controlled property evaluation

# Explicit experiment, separate from the normal suite and PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VT_OFT_JAR: ${{ github.workspace }}/.tools/openfasttrace-4.9.0.jar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python -m pip install '.[test]'
          vt install-oft --destination "$GITHUB_WORKSPACE/.tools"
          python scripts/evaluate_properties.py --out "$RUNNER_TEMP/property-evaluation"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: controlled-property-evaluation
          path: ${{ runner.temp }}/property-evaluation/
